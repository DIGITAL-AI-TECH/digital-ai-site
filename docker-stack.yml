services:
  web:
    image: registry.digital-ai.tech/digital-ai/digital-ai-site:latest
    networks:
      - oraculusnet_v2
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.digital-ai-site.rule=Host(`digital-ai.tech`)"
        - "traefik.http.routers.digital-ai-site.entrypoints=websecure"
        - "traefik.http.routers.digital-ai-site.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.digital-ai-site.service=digital-ai-site"
        - "traefik.http.services.digital-ai-site.loadbalancer.server.port=80"
        - "traefik.docker.network=oraculusnet_v2"

networks:
  oraculusnet_v2:
    external: true
